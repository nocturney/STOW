name: STOW CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stow:
    name: STOW build and tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build STOW
        run: dotnet build STOW.slnx -c Release

      - name: Run regression tests
        run: dotnet test STOW.slnx -c Release --no-build

      - name: Build self-contained STOW preview
        shell: powershell
        run: ./scripts/build-stow.ps1

      - name: Verify STOW preview package
        shell: powershell
        run: |
          $version = (Get-Content ./STOW_VERSION -Raw).Trim()
          $required = @(
            './dist-stow/STOW.exe',
            './dist-stow/STOWSetup.exe',
            "./dist-stow/STOW-$version-win-x64.zip",
            './dist-stow/STOW-Legal.zip',
            './dist-stow/SBOM.spdx.json',
            './dist-stow/SHA256SUMS.txt'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing STOW artifact: $path" } }

      - name: Verify licenses, notices and credits
        shell: powershell
        run: ./scripts/verify-release-legal.ps1

      - name: Validate package-manager metadata generation
        shell: powershell
        run: |
          $version = (Get-Content ./STOW_VERSION -Raw).Trim()
          $parameters = @{ Version = $version; OutputRoot = './artifacts/package-metadata-ci' }
          if ($version.Contains('-')) { $parameters.AllowPrerelease = $true }
          & ./scripts/generate-package-metadata.ps1 @parameters
          if (-not (Test-Path "./artifacts/package-metadata-ci/winget/$version/ChristianVelvet.STOW.installer.yaml")) { throw 'WinGet metadata was not generated.' }
          if (-not (Test-Path './artifacts/package-metadata-ci/scoop/stow.json')) { throw 'Scoop metadata was not generated.' }

  trayify-baseline:
    name: Trayify v0.3.3 compatibility baseline
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build untouched Trayify baseline
        shell: powershell
        run: ./scripts/build.ps1

      - name: Verify baseline artifacts
        shell: powershell
        run: |
          if (-not (Test-Path ./dist/Trayify.exe)) { throw "Trayify.exe was not produced" }
          if (-not (Test-Path ./dist/TrayifySetup.exe)) { throw "TrayifySetup.exe was not produced" }
          Get-FileHash ./dist/Trayify.exe -Algorithm SHA256
          Get-FileHash ./dist/TrayifySetup.exe -Algorithm SHA256
