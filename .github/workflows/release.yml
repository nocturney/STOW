name: STOW Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Validate release readiness
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build STOW
        run: dotnet build STOW.slnx -c Release

      - name: Run STOW tests
        run: dotnet test STOW.slnx -c Release --no-build

      - name: Build self-contained STOW preview
        shell: powershell
        run: ./scripts/build-stow.ps1

      - name: Verify self-contained preview contents
        shell: powershell
        run: |
          $version = (Get-Content ./STOW_VERSION -Raw).Trim()
          $required = @(
            './dist-stow/STOW.exe',
            './dist-stow/STOWSetup.exe',
            "./dist-stow/STOW-$version-win-x64.zip",
            './dist-stow/SHA256SUMS.txt',
            './dist-stow/DOTNET_RUNTIME_LICENSE.txt',
            './dist-stow/DOTNET_RUNTIME_THIRD_PARTY_NOTICES.txt',
            './dist-stow/DOTNET_WINDOWS_DESKTOP_LICENSE.txt',
            './dist-stow/DOTNET_WINDOWS_DESKTOP_THIRD_PARTY_NOTICES.txt'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing STOW artifact: $path" } }

      - name: Verify Trayify compatibility baseline still builds
        shell: powershell
        run: ./scripts/build.ps1

      - name: Verify Authenticode signing gate
        shell: powershell
        run: ./scripts/verify-release-signing.ps1

      - name: Publishing status
        if: always()
        shell: powershell
        run: |
          Write-Host "STOW publishing is intentionally disabled."
          Write-Host "Installer, migration and updater gates are complete; signing is the remaining binary-trust gate before final release validation."
