name: STOW Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Validate release readiness
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build STOW
        run: dotnet build STOW.slnx -c Release

      - name: Run STOW tests
        run: dotnet test STOW.slnx -c Release --no-build

      - name: Verify Trayify compatibility baseline still builds
        shell: powershell
        run: ./scripts/build.ps1

      - name: Publishing status
        shell: powershell
        run: |
          Write-Host "STOW publishing is intentionally disabled."
          Write-Host "Enable artifact publication only after STOW.exe, STOWSetup.exe, migration, signing and release validation are complete."
